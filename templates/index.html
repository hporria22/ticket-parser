<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Automation Tool</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #f4f6fa;
        --card: #ffffff;
        --text: #1a2233;
        --text-muted: #6b7385;
        --border: #e6e9f0;
        --border-strong: #d7dce6;

        --accent: #3454d1;
        --accent-hover: #2a45b8;
        --accent-soft: rgba(52, 84, 209, 0.08);

        --add-btn: #1a9e6d;
        --add-hover: #157d57;
        --remove-btn: #e6493f;
        --remove-hover: #cc3a30;

        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
        --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.06);
        --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.10);
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
        margin: 0;
        background:
            radial-gradient(1000px 400px at 50% -80px, rgba(52,84,209,0.06), transparent),
            var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
    }

    /* HEADER */

    .header {
        background: linear-gradient(135deg, #2f47b8, #3454d1 55%, #4a63e0);
        color: white;
        padding: 22px 24px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-align: center;
        position: relative;
        box-shadow: 0 2px 12px rgba(52, 84, 209, 0.25);
    }

    .header::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -1px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    }

    /* DROPDOWN RIGHT */

    .page-dropdown {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        transition: background 0.2s ease;
    }

    .page-dropdown:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    .page-dropdown .arrow {
        display: inline-block;
        font-size: 11px;
        transition: transform 0.2s;
    }

    .page-dropdown:hover .arrow {
        transform: rotate(90deg);
    }

    .page-dropdown .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        background-color: white;
        min-width: 190px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        border-radius: 10px;
        z-index: 1000;
        overflow: hidden;
        padding: 6px;
    }

    .page-dropdown:hover .dropdown-content {
        display: block;
    }

    .page-dropdown .dropdown-content a {
        color: var(--text);
        padding: 9px 12px;
        text-decoration: none;
        display: block;
        font-size: 13.5px;
        font-weight: 500;
        border-radius: 6px;
        transition: background 0.15s ease;
    }

    .page-dropdown .dropdown-content a:hover {
        background-color: var(--accent-soft);
        color: var(--accent);
    }

    /* CONTAINER */

    .container {
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        padding: 36px 20px 140px;
    }

    .page-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 4px 2px;
    }

    .page-subtitle {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        margin: 0 0 24px 2px;
    }

    /* ASSIGNED BY TOOLBAR */

    .toolbar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: var(--shadow-sm);
    }

    .toolbar label {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
    }

    .toolbar input {
        width: 220px;
        max-width: 100%;
    }

    /* CARD */

    .ticket-card {
        background: var(--card);
        border-radius: 14px;
        padding: 22px 22px 20px;
        margin-bottom: 18px;

        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);

        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        opacity: 0;
        transform: translateY(8px);
        animation: cardIn 0.35s ease forwards;
    }

    @keyframes cardIn {
        to { opacity: 1; transform: translateY(0); }
    }

    .ticket-card.removing {
        animation: cardOut 0.22s ease forwards;
    }

    @keyframes cardOut {
        to { opacity: 0; transform: translateY(-6px) scale(0.98); margin-bottom: 0; padding-top: 0; padding-bottom: 0; max-height: 0; }
    }

    .ticket-card:hover {
        border-color: rgba(52, 84, 209, 0.35);
        box-shadow: var(--shadow-md);
    }

    /* TITLE ROW */

    .ticket-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
    }

    .ticket-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 700;
        flex-shrink: 0;
    }

    .ticket-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.01em;
    }

    .field-label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 14px 0 6px 2px;
    }

    /* TEXTAREA */

    textarea {
        width: 100%;
        height: 140px;
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.5;
        font-family: inherit;
        resize: vertical;

        background: #fbfcfe;
        color: var(--text);

        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    textarea::placeholder,
    input::placeholder {
        color: #9aa1b2;
    }

    textarea:focus {
        outline: none;
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(52, 84, 209, 0.12);
    }

    /* SELECT + INPUT */

    select {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);

        background: #fbfcfe;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input {
        padding: 9px 12px;
        border-radius: 8px;
        background: #fbfcfe;
        color: var(--text);
        border: 1px solid var(--border);
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    select:focus,
    input:focus {
        outline: none;
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(52, 84, 209, 0.12);
    }

    /* BUTTONS */

    button {
        border: none;
        border-radius: 9px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.08s ease;
    }

    button:active {
        transform: scale(0.97);
    }

    .actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
    }

    .remove {
        background: rgba(230, 73, 63, 0.1);
        color: var(--remove-btn);
        padding: 8px 14px;
        font-size: 13px;
    }

    .remove:hover {
        background: var(--remove-btn);
        color: white;
    }

    /* STICKY ACTION BAR — keeps Add/Generate in a fixed spot so growing
       ticket list never shifts them out from under the cursor */

    .sticky-actions {
        position: sticky;
        bottom: 0;
        left: 0;
        right: 0;
        margin-top: 26px;
        padding: 16px;
        background: rgba(244, 246, 250, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--border-strong);
        border-radius: 14px 14px 0 0;
        display: flex;
        gap: 12px;
        box-shadow: 0 -8px 24px rgba(16, 24, 40, 0.06);
    }

    .add {
        background: var(--add-btn);
        color: white;
        padding: 13px 20px;
        flex-shrink: 0;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(26, 158, 109, 0.25);
    }

    .add:hover {
        background: var(--add-hover);
        box-shadow: 0 4px 14px rgba(26, 158, 109, 0.35);
    }

    .generate {
        flex: 1;
        background: var(--accent);
        color: white;
        font-size: 15px;
        padding: 13px 20px;
        box-shadow: 0 2px 8px rgba(52, 84, 209, 0.25);
    }

    .generate:hover {
        background: var(--accent-hover);
        box-shadow: 0 4px 14px rgba(52, 84, 209, 0.35);
    }

    /* FOOTER */

    .footer-note {
        text-align: center;
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 13px;
    }
    </style>
</head>

<body>
    <div class="header">
        Automation 2.O

        <!-- Compact Page Dropdown -->
        <div class="page-dropdown">
            <span class="arrow">▶</span>
            <div class="dropdown-content">
                <a href="/">Ticket Automation Tool</a>
                <a href="/extractor">Ticket Extractor</a>
                <a href="/validator">Validators</a>

            </div>
        </div>

        <!-- Theme toggle -->
        <!-- <button class="theme-toggle" id="themeBtn">☀️</button> -->
    </div>

    <div class="container">
        <div class="page-title">Ticket Automation</div>
        <div class="page-subtitle">Generate your report</div>

        <form action="/process" method="post" id="ticketForm">
            <div class="toolbar">
                <label>Assigned by</label>
                <input type="text" name="assigned_by" list="assignedByList" placeholder="Select or type a name">
            </div>

            <div id="tickets">
                <div class="ticket-card">
                    <div class="ticket-title-row">
                        <span class="ticket-badge">1</span>
                        <span class="ticket-title">Ticket 1</span>
                    </div>
                    <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>
                    <label class="field-label" for="query_related_1">Query related to</label>
                    <select name="query_related_1" id="query_related_1"></select>
                    <label class="field-label">Assigned by (if different)</label>
                    <input type="text" name="assigned_by_ticket_1" list="assignedByList" placeholder="Optional">
                </div>
            </div>

            <div class="sticky-actions">
                <button type="button" class="add" onclick="addTicket()">+ Add Another Ticket</button>
                <button type="submit" class="generate">Generate Excel</button>
            </div>
        </form>

        <datalist id="assignedByList">
            <option value="Kashish">
            <option value="Ashish">
            <option value="Nikita">
            <option value="Harsh">
            <option value="Vipul">
            <option value="Roocha">
            <option value="Kishan">
            <option value="Dilleswari">
            <option value="Utkarsh">
            <option value="Ravindra">
            <option value="Abhishek">
            <option value="Pawan">
            <option value="Ajay">
            <option value="Rahul">
            <option value="Jaydeep">
            <option value="Thorani">
            <option value="Prasad">

        </datalist>
        <script type="application/json" id="dropdown-data">
            {{ query_options | tojson }}
        </script>

        <div class="footer-note">

        </div>
    </div>

    <script>
        let ticketCount = 1;

        function addTicket() {
            ticketCount++;

            const container = document.getElementById("tickets");

            const card = document.createElement("div");
            card.className = "ticket-card";

            card.innerHTML = `
            <div class="ticket-title-row">
                <span class="ticket-badge">${ticketCount}</span>
                <span class="ticket-title">Ticket ${ticketCount}</span>
            </div>

            <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>

            <label class="field-label">Query related to</label>
            <select name="query_related_${ticketCount}">
            <option value="">-- default --</option>
            </select>

            <label class="field-label">Assigned by (if different)</label>
            <input type="text" name="assigned_by_ticket_${ticketCount}" list="assignedByList" placeholder="Optional">

            <div class="actions">
            <button type="button" class="remove" onclick="removeTicket(this)">Remove</button>
            </div>
            `;

            container.appendChild(card);

            const selectElem = card.querySelector("select");
            populateDropdown(selectElem);

            // Bring the new card into view smoothly so its position never
            // catches the user off guard mid-click.
            card.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function removeTicket(btn) {
            const card = btn.closest(".ticket-card");
            card.classList.add("removing");
            card.addEventListener("animationend", () => {
                card.remove();
                updateTicketNumbers();
            }, { once: true });
        }

        function updateTicketNumbers() {

            const cards = document.querySelectorAll(".ticket-card");

            cards.forEach((card, index) => {

                const title = card.querySelector(".ticket-title");
                const badge = card.querySelector(".ticket-badge");

                title.textContent = `Ticket ${index + 1}`;
                if (badge) badge.textContent = index + 1;

            });

            ticketCount = cards.length;

        }
        function populateDropdown(selectElem) {

            const options = JSON.parse(
                document.getElementById("dropdown-data").textContent
            );

            options.forEach(opt => {

                const option = document.createElement("option");

                option.value = opt;
                option.textContent = opt;

                selectElem.appendChild(option);

            });
        }

        window.onload = function () {

            const firstSelect = document.querySelector("select[name='query_related_1']");

            if (firstSelect) {

                firstSelect.innerHTML = `<option value="">default</option>`;

                populateDropdown(firstSelect);

            }

        };


        // Theme toggle
        // const themeBtn = document.getElementById("themeBtn");

        // themeBtn.addEventListener("click", () => {

        //     document.body.classList.toggle("dark");

        //     themeBtn.textContent =
        //         document.body.classList.contains("dark") ? "🌙" : "☀️";

        // });
    </script>
</body>

</html>
