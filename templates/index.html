<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <title>Ticket Automation Tool</title>
    <style>
       :root {
    --bg-light: #0b1220;
    --bg-dark: #0b1220;

    --card-light: rgba(255,255,255,0.05);
    --card-dark: rgba(255,255,255,0.05);

    --text-light: #e2e8f0;
    --text-dark: #e2e8f0;

    --border: rgba(255,255,255,0.08);

    --btn-light: #6366f1;
    --btn-dark: #6366f1;

    --btn-hover-light: #4f46e5;
    --btn-hover-dark: #4f46e5;

    --add-btn: #22c55e;
    --remove-btn: #ef4444;
}

body {
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color: var(--text-light);
}

/* HEADER */

.header {
    background: rgba(2, 6, 23, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    color: white;
    padding: 18px;
    font-size: 22px;
    text-align: center;
    position: relative;
}

/* CONTAINER (UNCHANGED SIZE) */

.container {
    width: 1100px;
    margin: 30px auto;
}

/* CARD */

.ticket-card {
    background: var(--card-light);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;

    border: 1px solid var(--border);
    backdrop-filter: blur(10px);

    box-shadow: 0 0 0 rgba(0,0,0,0);
    transition: 0.25s ease;
}

.ticket-card:hover {
    border-color: rgba(99,102,241,0.4);
    box-shadow: 0 0 15px rgba(99,102,241,0.15);
}

/* TITLE */

.ticket-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #c7d2fe;
}

/* TEXTAREA (SIZE SAME) */

textarea {
    width: 100%;
    height: 150px;
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 10px;
    font-size: 14px;
    resize: vertical;

    background: rgba(0,0,0,0.35);
    color: white;

    transition: 0.2s;
}

textarea:focus {
    outline: none;
    border-color: var(--btn-light);
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
}

/* SELECT + INPUT (SIZE SAME) */

select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 10px;

    background: rgba(0,0,0,0.35);
    color: white;
}

input {
    background: rgba(0,0,0,0.35);
    color: white;
    border: 1px solid var(--border);
}

select:focus,
input:focus {
    outline: none;
    border-color: var(--btn-light);
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
}

/* BUTTONS (SIZE SAME) */

button {
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.add {
    background: var(--add-btn);
    color: white;
}

.add:hover {
    background: #16a34a;
    transform: translateY(-1px);
}

.remove {
    background: var(--remove-btn);
    color: white;
}

.remove:hover {
    background: #dc2626;
    transform: translateY(-1px);
}

.generate {
    width: 100%;
    background: var(--btn-light);
    color: white;
    font-size: 16px;
    padding: 14px;
    margin-top: 20px;
}

.generate:hover {
    background: var(--btn-hover-light);
    box-shadow: 0 0 20px rgba(99,102,241,0.3);
}

/* FOOTER */

.footer-note {
    text-align: center;
    margin-top: 15px;
    color: #94a3b8;
    font-size: 13px;
}

/* DROPDOWN (UNCHANGED STRUCTURE) */

.page-dropdown {
    display: inline-block;
    position: absolute;
    right: 60px;
    top: 14px;
    cursor: pointer;
    font-size: 18px;
}

.page-dropdown .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 20px;
    background-color: #020617;
    border: 1px solid var(--border);
    min-width: 180px;
    border-radius: 6px;
}

.page-dropdown:hover .dropdown-content {
    display: block;
}

.page-dropdown .dropdown-content a {
    color: white;
    padding: 8px 12px;
    text-decoration: none;
    display: block;
    font-size: 14px;
}

.page-dropdown .dropdown-content a:hover {
    background-color: rgba(255,255,255,0.08);
}
    </style>
</head>

<body>
    <div class="header">
        Automation 2.O

        <!-- Compact Page Dropdown -->
        <div class="page-dropdown">
            <span class="arrow">▶</span>
            <div class="dropdown-content">
                <a href="/">Ticket Automation Tool</a>
                <a href="/extractor">Ticket Extractor</a>
                <a href="/validator">Validators</a>

            </div>
        </div>

        <!-- Theme toggle -->
        <!-- <button class="theme-toggle" id="themeBtn">☀️</button> -->
    </div>

    <div class="container">
        <form action="/process" method="post">
            <label>Assigned by:</label>
            <input type="text" name="assigned_by" list="assignedByList"
                style="width:10%; padding:8px; margin-bottom:15px;">
            <div id="tickets">
                <div class="ticket-card">
                    <div class="ticket-title">Ticket 1</div>
                    <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>
                    <label for="query_related_1">Query related to:</label>
                    <select name="query_related_1"></select>
                    <label>Assigned by(if different)</label>
                 <input type="text" name="assigned_by_ticket_1" list="assignedByList" >
                </div>
            </div>
            <div class="actions">
                <button type="button" class="add" onclick="addTicket()">+ Add Another Ticket</button>
            </div>
            <button class="generate">Generate Excel</button>
        </form>
        <datalist id="assignedByList">
            <option value="Kashish">
            <option value="Ashish">
            <option value="Nikita">
            <option value="Harsh">
            <option value="Vipul">
            <option value="Roocha">
            <option value="Kishan">
            <option value="Dilleswari">
            <option value="Utkarsh">
            <option value="Ravindra">
            <option value="Abhishek">
            <option value="Pawan">
            <option value="Ajay">
            <option value="Rahul">
            <option value="Jaydeep">

        </datalist>
        <script type="application/json" id="dropdown-data">
            {{ query_options | tojson }}
        </script>

        <div class="footer-note">
           
        </div>
    </div>

    <script>
        let ticketCount = 1;

        function addTicket() {
            ticketCount++;

            const container = document.getElementById("tickets");

            const card = document.createElement("div");
            card.className = "ticket-card";

            card.innerHTML = `
            <div class="ticket-title">Ticket ${ticketCount}</div>
            
            <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>
            
            <label>Query related to:</label>
            <select name="query_related_${ticketCount}">
            <option value="">-- default --</option>
            </select>
            
            <label>Assigned by(if different)</label>
            <input type="text" name="assigned_by_ticket_${ticketCount}" list="assignedByList" >
            
            <div class="actions">
            <button type="button" class="remove" onclick="removeTicket(this)">Remove</button>
            </div>
            `;

            container.appendChild(card);

            const selectElem = card.querySelector("select");
            populateDropdown(selectElem);
        }

        function removeTicket(btn) {
            btn.closest(".ticket-card").remove();
            updateTicketNumbers();

        }

        function updateTicketNumbers() {

            const cards = document.querySelectorAll(".ticket-card");

            cards.forEach((card, index) => {

                const title = card.querySelector(".ticket-title");

                title.textContent = `Ticket ${index + 1}`;

            });

            ticketCount = cards.length;

        }
        function populateDropdown(selectElem) {

            const options = JSON.parse(
                document.getElementById("dropdown-data").textContent
            );

            options.forEach(opt => {

                const option = document.createElement("option");

                option.value = opt;
                option.textContent = opt;

                selectElem.appendChild(option);

            });
        }

        window.onload = function () {

            const firstSelect = document.querySelector("select[name='query_related_1']");

            if (firstSelect) {

                firstSelect.innerHTML = `<option value="">default</option>`;

                populateDropdown(firstSelect);

            }

        };


        // Theme toggle
        // const themeBtn = document.getElementById("themeBtn");

        // themeBtn.addEventListener("click", () => {

        //     document.body.classList.toggle("dark");

        //     themeBtn.textContent =
        //         document.body.classList.contains("dark") ? "🌙" : "☀️";

        // });
    </script>
</body>

</html>
