<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <title>Ticket Automation Tool</title>
    <style>
        :root {
            --bg-light: #f1f4f9;
            --bg-dark: #0f172a;
            --card-light: #ffffff;
            --card-dark: #111827;
            --text-light: #111827;
            --text-dark: #ffffff;
            --btn-light: #1e40af;
            /* blue */
            --btn-dark: #243a8f;
            --btn-hover-light: #1c3a94;
            --btn-hover-dark: #1f2f77;
            --add-btn: #16a34a;
            --remove-btn: #dc2626;
            --sun-color: #facc15;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .header {
            background: var(--btn-light);
            color: white;
            padding: 18px;
            font-size: 22px;
            text-align: center;
            position: relative;
            transition: background 0.3s;
        }

        body.dark .header {
            background: var(--btn-dark);
        }

        .container {
            width: 1100px;
            margin: 30px auto;
        }

        .ticket-card {
            background: var(--card-light);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: background 0.3s, color 0.3s;
        }

        body.dark .ticket-card {
            background: var(--card-dark);
            color: var(--text-dark);
        }

        .ticket-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            background: #e5e7eb;
            color: #111827;
        }

        body.dark textarea {
            background: #1f2937;
            color: white;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .add {
            background: var(--add-btn);
            color: white;
        }

        .remove {
            background: var(--remove-btn);
            color: white;
        }

        .generate {
            width: 100%;
            background: var(--btn-light);
            color: white;
            font-size: 16px;
            padding: 14px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        body.dark .generate {
            background: var(--btn-dark);
        }

        .footer-note {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
        }

        /* Theme toggle button */
        /* .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sun-color);
        }

        body.dark .theme-toggle {
            background: #111827;
            color: var(--sun-color);
        } */

        /* Compact page dropdown */
        .page-dropdown {
            display: inline-block;
            position: absolute;
            right: 60px;
            top: 14px;
            cursor: pointer;
            font-size: 18px;
            padding: 3px;
        }

        .page-dropdown .arrow {
            display: inline-block;
            transition: transform 0.2s;
        }

        .page-dropdown:hover .arrow {
            transform: rotate(90deg);
        }

        .page-dropdown .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 20px;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            z-index: 1000;
        }

        .page-dropdown:hover .dropdown-content {
            display: block;
        }

        .page-dropdown .dropdown-content a {
            color: #111827;
            padding: 8px 12px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }

        .page-dropdown .dropdown-content a:hover {
            background-color: #f1f4f9;
        }

        body.dark .page-dropdown .dropdown-content {
            background-color: #111827;
        }

        body.dark .page-dropdown .dropdown-content a {
            color: white;
        }

        body.dark .page-dropdown .dropdown-content a:hover {
            background-color: #1f2937;
        }
    </style>
</head>

<body>
    <div class="header">
        ServiceNow Ticket Excel Automation

        <!-- Compact Page Dropdown -->
        <div class="page-dropdown">
            <span class="arrow">▶</span>
            <div class="dropdown-content">
                <a href="/">Ticket Automation Tool</a>
                <a href="/extractor">Ticket Extractor</a>
                <a href="/validator">Validators</a>

            </div>
        </div>

        <!-- Theme toggle -->
        <!-- <button class="theme-toggle" id="themeBtn">☀️</button> -->
    </div>

    <div class="container">
        <form action="/process" method="post">
            <div id="tickets">
                <div class="ticket-card">
                    <div class="ticket-title">Ticket 1</div>
                    <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>
                    <label for="query_related_1">Query related to:</label>
                    <select name="query_related_1"></select>
                </div>
            </div>
            <div class="actions">
                <button type="button" class="add" onclick="addTicket()">+ Add Another Ticket</button>
            </div>
            <button class="generate">Generate Excel</button>
        </form>

        <script type="application/json" id="dropdown-data">
            {{ query_options | tojson }}
        </script>

        <div class="footer-note">
            Paste one ticket per box and click Generate Excel
        </div>
    </div>

    <script>
        let ticketCount = 1;

        function addTicket() {
            ticketCount++;

            const container = document.getElementById("tickets");

            const card = document.createElement("div");
            card.className = "ticket-card";

            card.innerHTML = `
        <div class="ticket-title">Ticket ${ticketCount}</div>

        <textarea name="tickets" placeholder="Paste complete ServiceNow ticket text here"></textarea>

        <label>Query related to:</label>

        <select name="query_related_${ticketCount}">
            <option value="">-- Use default from subcategory --</option>
        </select>

        <div class="actions">
            <button type="button" class="remove" onclick="removeTicket(this)">Remove Ticket</button>
        </div>
    `;

            container.appendChild(card);

            const selectElem = card.querySelector("select");
            populateDropdown(selectElem);
        }

        function removeTicket(btn) {
            btn.closest(".ticket-card").remove();
        }

        function populateDropdown(selectElem) {

            const options = JSON.parse(
                document.getElementById("dropdown-data").textContent
            );

            options.forEach(opt => {

                const option = document.createElement("option");

                option.value = opt;
                option.textContent = opt;

                selectElem.appendChild(option);

            });
        }

        window.onload = function () {

            const firstSelect = document.querySelector("select[name='query_related_1']");

            if (firstSelect) {

                firstSelect.innerHTML = `<option value="">-- Use default from subcategory --</option>`;

                populateDropdown(firstSelect);

            }

        };


        // Theme toggle
        // const themeBtn = document.getElementById("themeBtn");

        // themeBtn.addEventListener("click", () => {

        //     document.body.classList.toggle("dark");

        //     themeBtn.textContent =
        //         document.body.classList.contains("dark") ? "🌙" : "☀️";

        // });
    </script>
</body>

</html>
